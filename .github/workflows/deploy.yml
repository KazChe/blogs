name: Deploy to DO Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: bun run build

      - name: Sync hashed assets (immutable, 1y cache)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}
          AWS_REGION: us-east-1
        run: |
          aws s3 sync dist/ s3://${{ secrets.DO_SPACES_BUCKET }}/ \
            --endpoint-url https://${{ secrets.DO_SPACES_ENDPOINT }} \
            --acl public-read \
            --delete \
            --exclude "*.html" \
            --exclude "*.xml" \
            --exclude "*.txt" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync HTML/XML/TXT (short cache, must revalidate)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}
          AWS_REGION: us-east-1
        run: |
          aws s3 sync dist/ s3://${{ secrets.DO_SPACES_BUCKET }}/ \
            --endpoint-url https://${{ secrets.DO_SPACES_ENDPOINT }} \
            --acl public-read \
            --exclude "*" \
            --include "*.html" \
            --include "*.xml" \
            --include "*.txt" \
            --cache-control "public, max-age=300, must-revalidate"

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_TOKEN }}

      - name: Purge CDN cache
        run: doctl compute cdn flush ${{ secrets.DO_CDN_ID }} --files '*'
