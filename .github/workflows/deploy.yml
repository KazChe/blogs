name: Deploy to droplet

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY_HOST: 138.68.238.161
  DEPLOY_USER: root
  DEPLOY_PATH: /var/www/untounium.dev/
  SITE_URL: https://untounium.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.BLOG_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Pin droplet host key
        run: |
          cat >> ~/.ssh/known_hosts <<'EOF'
          138.68.238.161 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBhGFrgsrB9IioA8pL4/vbDR2XmGZKyyLhkPUNvF4EYC
          EOF
          chmod 644 ~/.ssh/known_hosts

      - name: Rsync dist to droplet
        run: |
          rsync -avz --delete --human-readable \
            -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            dist/ ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}

      - name: Smoke test
        run: |
          curl -fsSL -o /dev/null -w "homepage: %{http_code}\n" "${SITE_URL}/"
          curl -fsSL -o /dev/null -w "about:    %{http_code}\n" "${SITE_URL}/about/"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
